# Hidden files and folders (.env, .git/, ...) are not served, except .well-known/
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.(?!well-known(/|$))">
    Require all denied
</DirectoryMatch>

# Slow or stalled connections are dropped sooner (Debian's default is 300 s); not a limit on script run time
Timeout 60

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
</IfModule>
