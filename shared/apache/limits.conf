# Request bodies larger than post_max_size + 10% are rejected before PHP reads them
# (APACHE_LIMIT_REQUEST_BODY, set by docker-webserver-entrypoint)
LimitRequestBody ${APACHE_LIMIT_REQUEST_BODY}

# Apache/PHP processes per container; each needs tens of MB (APACHE_MAX_REQUEST_WORKERS)
<IfModule mpm_prefork_module>
    ServerLimit ${APACHE_MAX_REQUEST_WORKERS}
    MaxRequestWorkers ${APACHE_MAX_REQUEST_WORKERS}
</IfModule>
