; Values come from the XDEBUG_* environment variables (see README)
xdebug.mode = ${XDEBUG_MODE}
xdebug.client_host = ${XDEBUG_REMOTE_HOST}
xdebug.client_port = ${XDEBUG_REMOTE_PORT}
xdebug.start_with_request = trigger
xdebug.trigger_value = ${XDEBUG_IDE_KEY}
xdebug.output_dir = ${XDEBUG_OUTPUT_DIR}
xdebug.profiler_output_name = ${XDEBUG_OUTPUT_PROFILE_NAME}
xdebug.max_nesting_level = 500
